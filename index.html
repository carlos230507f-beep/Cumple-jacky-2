<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Jackeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <section id="inicio">
            <div class="tarjeta">
                <img src="./img/jackeline_inicio.png" class="imagen" alt="Snoopy y Woodstock">
                <div class="botones">
                    <button id="btnSi" type="button">Sí</button>
                    <button id="btnNo" type="button">No</button>
                </div>
            </div>
        </section>

        <section id="cumpleanos" class="oculto">
            <div class="tarjeta">
                <img src="./img/jackeline_cumple_completo.png" class="imagen" alt="Snoopy feliz cumpleaños Jackeline">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
